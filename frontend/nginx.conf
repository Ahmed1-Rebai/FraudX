server {
    listen 80;
    root /usr/share/nginx/html;

    # Re-resolve `api` through Docker's DNS: when the API container is recreated
    # it can get a new IP, and a name resolved once at startup would answer 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same origin as the app, so no CORS. Buffering off for the live SSE stream.
    location /api/ {
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Swagger UI at /api/docs loads the schema from the site root.
    location = /openapi.json {
        set $api http://api:8000;
        proxy_pass $api/openapi.json;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
