global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fraudx-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  # Stream workers: DNS discovery finds every replica of a scaled service.
  - job_name: feature-processor
    dns_sd_configs:
      - names: ["feature-processor"]
        type: A
        port: 9100

  # Scorer and sinks are added here as they are implemented.
