global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fraudx-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  # Stream workers: DNS discovery finds every replica of a scaled service.
  - job_name: workers
    dns_sd_configs:
      - names: [feature-processor, graph-writer, history-writer, profile-writer]
        type: A
        port: 9100
    relabel_configs:
      # Label each target with its service name (from the DNS query name).
      - source_labels: [__meta_dns_name]
        target_label: service

  # The scorer is added here in Phase 8.
