[project]
name = "fraudx"
version = "0.1.0"
description = "FraudX - real-time fraud detection on a polyglot NoSQL platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Ahmed1-Rebai" }]
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.35",
    "prometheus-client>=0.22",
    "confluent-kafka>=2.11",
    "pymongo>=4.13",
    "redis>=6.0",
    "cassandra-driver>=3.29",
    "neo4j>=5.28",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "polars>=2.0.0",
    "anthropic>=1.15.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # dummy credentials in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: requires the docker compose stack (make up)",
]
