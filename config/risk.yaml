# Risk engine parameters. Validated at load time (weights must sum to 1.0).
# Generated by `python -m fraudx.ml tune-risk` (2026-10-16T23:10:42+00:00): weights and
# thresholds were chosen on the validation split; evidence in docs/experiments/2026-10-16-risk-engine.md.
# Signals are calibrated fraud probabilities (fraudx.scoring.detectors).
# Re-tune after retraining a model; scores are only comparable across runs
# that used the same configuration.
risk:
  weights:
    ml: 0.5
    anomaly: 0.1
    graph: 0.4
  thresholds:
    medium: 8   # score >= medium -> MEDIUM (review queue, best F2)
    high: 23     # score >= high -> HIGH (best F1)
  alert_threshold: 23
