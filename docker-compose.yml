# FraudX local platform.
#
#   make env && docker compose up -d     # whole stack
#   docker compose ps                    # every service reports (healthy)
#
# All ports bind to 127.0.0.1 only. Secrets come from .env (see .env.example);
# required variables fail fast with a clear message if missing.
# *-init services are one-shot provisioning jobs (topics, schemas) and exit 0.

name: fraudx

x-app-env: &app-env
  FRAUDX_ENV: ${FRAUDX_ENV:-local}
  FRAUDX_LOG_LEVEL: ${FRAUDX_LOG_LEVEL:-INFO}
  FRAUDX_LOG_FORMAT: ${FRAUDX_LOG_FORMAT:-json}
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  MONGO_HOST: mongodb
  MONGO_DB: ${MONGO_DB:-fraudx}
  MONGO_APP_USER: ${MONGO_APP_USER:-fraudx_app}
  MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
  CASSANDRA_CONTACT_POINTS: cassandra
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}

x-worker: &worker
  image: fraudx:latest
  environment:
    <<: *app-env
    WORKER_METRICS_PORT: 9100
  healthcheck:
    test: ["CMD", "python", "-m", "fraudx.messaging.heartbeat", "/tmp/fraudx/heartbeat", "30"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 30s
  stop_grace_period: 30s
  restart: unless-stopped

services:
  # --- Event backbone ---------------------------------------------------------
  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID in .env}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are provisioned explicitly
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.1.0
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}
    volumes:
      - ./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: fraudx
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # --- Polyglot storage -------------------------------------------------------
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_DB: ${MONGO_DB:-fraudx}
      MONGO_APP_USER: ${MONGO_APP_USER:-fraudx_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./infra/mongodb/init.js:/docker-entrypoint-initdb.d/10-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  cassandra:
    image: cassandra:5.0
    environment:
      CASSANDRA_CLUSTER_NAME: fraudx
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  cassandra-init:
    image: cassandra:5.0
    entrypoint: ["cqlsh", "cassandra", "-f", "/schema/schema.cql"]
    volumes:
      - ./infra/cassandra/schema.cql:/schema/schema.cql:ro
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:8.2-alpine
    # Password via env so it never appears in `docker inspect` command args.
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Disposable Redis for offline feature builds (training data). Separate from
  # the live store so big builds never evict live state. No persistence;
  # "noeviction" makes an over-sized build fail loudly instead of silently
  # producing wrong features. Start with: docker compose --profile jobs up -d redis-offline
  redis-offline:
    image: redis:8.2-alpine
    profiles: ["jobs"]
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 10gb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"   # browser
      - "127.0.0.1:7687:7687"   # bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  neo4j-init:
    image: neo4j:5.26-community
    entrypoint: ["sh", "-c", "cypher-shell -a bolt://neo4j:7687 -u neo4j -p \"$$NEO4J_PASSWORD\" -f /schema/schema.cypher"]
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ./infra/neo4j/schema.cypher:/schema/schema.cypher:ro
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  # --- Application services ---------------------------------------------------
  api:
    build: .
    image: fraudx:latest
    environment: *app-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
      neo4j-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Stream workers. Each is its own consumer group; scale any of them with
  #   docker compose up -d --scale <service>=N   (N <= 6 partitions)
  feature-processor:
    <<: *worker
    command: ["python", "-m", "fraudx.streaming"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  graph-writer:
    <<: *worker
    command: ["python", "-m", "fraudx.storage", "graph"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      neo4j-init:
        condition: service_completed_successfully

  history-writer:
    <<: *worker
    command: ["python", "-m", "fraudx.storage", "history"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully

  profile-writer:
    <<: *worker
    command: ["python", "-m", "fraudx.storage", "profile"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy

  # One-shot job (profile "jobs"): publish a dataset from ./data to transactions.raw.
  #   docker compose run --rm replay [--rate 500 --limit 10000]
  replay:
    image: fraudx:latest
    profiles: ["jobs"]
    entrypoint: ["python", "-m", "fraudx.ingestion", "replay", "--dataset", "data/generated"]
    command: ["--rate", "200", "--rebase-time"]
    environment: *app-env
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  # --- Observability ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  kafka-data:
  mongo-data:
  cassandra-data:
  redis-data:
  neo4j-data:
  prometheus-data:
  grafana-data:
